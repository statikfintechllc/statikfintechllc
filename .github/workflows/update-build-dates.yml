name: Update Build Dates

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:  # Allow manual triggering

jobs:
  update-build-dates:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Extract GitHub Build Dates
      env:
        GH_TOKEN: ${{ secrets.PAT_GITHUB }}
        GITHUB_TOKEN: ${{ secrets.PAT_GITHUB }}
      run: |
        # Create build dates extraction script
        cat > extract_build_dates.js << 'EOF'
        const { Octokit } = require('@octokit/rest');
        
        const octokit = new Octokit({
          auth: process.env.GH_TOKEN
        });
        
        async function extractBuildDates() {
          try {
            console.log('Extracting build dates from GitHub repositories...');
            
            const repos = [
              'GremlinGPT',
              'IB-G.Scanner', 
              'Pilot-Server',
              'Gremlin-ShadTail-Trader',
              'AscendNet',
              'statik-server',
              'Ascend-Institute',
              'AscendDocs',
              'Dragon-Boot',
              'GodCore',
              'Gremlin-MCP-Scrap',
              'Mobile-Mirror'
            ];
            
            const buildDates = {};
            
            for (const repo of repos) {
              try {
                // Get latest commit
                const { data: commits } = await octokit.rest.repos.listCommits({
                  owner: 'statikfintechllc',
                  repo: repo,
                  per_page: 1
                });
                
                if (commits.length > 0) {
                  const latestCommit = commits[0];
                  const commitDate = new Date(latestCommit.commit.committer.date);
                  buildDates[repo] = {
                    date: commitDate.toISOString().split('T')[0],
                    hash: latestCommit.sha.substring(0, 7),
                    message: latestCommit.commit.message.split('\n')[0],
                    url: latestCommit.html_url
                  };
                  console.log(`${repo}: ${buildDates[repo].date} (${buildDates[repo].hash})`);
                }
                
                // Rate limiting
                await new Promise(resolve => setTimeout(resolve, 100));
                
              } catch (error) {
                console.error(`Error fetching ${repo}:`, error.message);
                buildDates[repo] = {
                  date: new Date().toISOString().split('T')[0],
                  hash: 'unknown',
                  message: 'Repository access error',
                  url: ''
                };
              }
            }
            
            // Write build dates to JSON file
            require('fs').writeFileSync('build_dates.json', JSON.stringify(buildDates, null, 2));
            console.log('Build dates extracted successfully!');
            
          } catch (error) {
            console.error('Error extracting build dates:', error);
            process.exit(1);
          }
        }
        
        extractBuildDates();
        EOF
        
        # Install dependencies and run extraction
        npm init -y
        npm install @octokit/rest
        node extract_build_dates.js
        
    - name: Update Website Build Dates
      run: |
        # Create script to update HTML with build dates
        cat > update_html_dates.js << 'EOF'
        const fs = require('fs');
        
        try {
          const buildDates = JSON.parse(fs.readFileSync('build_dates.json', 'utf8'));
          
          // Read the www HTML file
          let htmlContent = fs.readFileSync('www.sfti-ai.org/index.html', 'utf8');
          
          // Update project cards with real build dates
          for (const [repo, info] of Object.entries(buildDates)) {
            const repoPattern = new RegExp(`(data-project="${repo.toLowerCase()}"[\\s\\S]*?<p>)([^<]*)(</p>)`, 'i');
            const replacement = `$1Last updated: ${info.date} (${info.hash})$3`;
            htmlContent = htmlContent.replace(repoPattern, replacement);
          }
          
          // Write updated HTML
          fs.writeFileSync('www.sfti-ai.org/index.html', htmlContent);
          console.log('HTML build dates updated successfully!');
          
        } catch (error) {
          console.error('Error updating HTML:', error);
        }
        EOF
        
        node update_html_dates.js
        
    - name: Commit and push changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add build_dates.json www.sfti-ai.org/index.html
        git diff --staged --quiet || git commit -m "Update build dates from GitHub repositories"
        git push