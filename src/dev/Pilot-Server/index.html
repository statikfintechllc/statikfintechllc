<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pilot Server - AI Chat Interface</title>
    <meta name="description" content="Advanced AI chat interface with multi-model support and autonomous server management">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/public/manifest.json">
    
    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Pilot Server">
    
    <!-- Favicons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/public/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/public/icon-16x16.png">
    <link rel="shortcut icon" href="/public/favicon.png">
    
    <!-- Apple Touch Icons -->
    <link rel="apple-touch-icon" sizes="180x180" href="/public/icon-180x180.png">
    <link rel="apple-touch-icon" sizes="152x152" href="/public/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="144x144" href="/public/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="128x128" href="/public/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="96x96" href="/public/icon-96x96.png">
    <link rel="apple-touch-icon" sizes="72x72" href="/public/icon-72x72.png">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#FF0000">
    <meta name="msapplication-TileColor" content="#000000">
    <meta name="msapplication-TileImage" content="/public/icon-144x144.png">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <link href="/src/main.css" rel="stylesheet" />
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/public/sw.js')
                    .then((registration) => {
                        console.log('Pilot Server SW: Service Worker registered successfully:', registration.scope);
                    })
                    .catch((registrationError) => {
                        console.log('Pilot Server SW: Service Worker registration failed:', registrationError);
                    });
            });
        }
    </script>
</body>

</html>
