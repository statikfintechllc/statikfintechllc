<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SFTi Stock Scanner</title>
    <meta name="description" content="Professional real-time penny stock scanner with AI-powered analysis and Interactive Brokers integration">
    
    <!-- Favicons -->
    <link rel="icon" type="image/x-icon" href="../../public/favicon.ico">
    <link rel="icon" type="image/png" sizes="16x16" href="../../public/icon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../../public/icon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="../../public/icon-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="../../public/icon-512x512.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../../public/icon-180x180.png">
    <link rel="apple-touch-icon" sizes="152x152" href="../../public/icon-152x152.png">
    <link rel="apple-touch-icon" sizes="144x144" href="../../public/icon-144x144.png">
    <link rel="apple-touch-icon" sizes="128x128" href="../../public/icon-128x128.png">
    <link rel="apple-touch-icon" sizes="72x72" href="../../public/icon-72x72.png">
    
    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">
    
    <!-- Apple PWA Meta Tags -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="SFTi Scanner">
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#10b981">
    <meta name="msapplication-TileColor" content="#0f172a">
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="/src/main.css" rel="stylesheet" />
</head>

<body class="dark">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('SW registered: ', registration);
                    })
                    .catch((registrationError) => {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>

</html>
