<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFTi Server Portal</title>
    <meta name="description" content="Secure access portal for SFTi authentication and backend services">
    
    <!-- PWA Configuration -->
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#e11d48">
    
    <!-- Styles -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#e11d48',
                        secondary: '#f59e0b',
                        accent: '#10b981'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-900 text-white">
    <div class="min-h-screen flex items-center justify-center p-4">
        <div class="max-w-2xl w-full">
            <div class="text-center mb-12">
                <h1 class="text-6xl font-bold mb-6 bg-gradient-to-r from-primary to-secondary bg-clip-text text-transparent">
                    SFTi Server
                </h1>
                <p class="text-xl text-gray-300">
                    Secure Authentication & Backend Services Portal
                </p>
            </div>
            
            <!-- Authentication Card -->
            <div class="bg-gray-800 rounded-lg p-8 mb-8">
                <h2 class="text-2xl font-semibold mb-6 text-center">Access Portal</h2>
                
                <form id="loginForm" class="space-y-4">
                    <div>
                        <label for="email" class="block text-sm font-medium text-gray-300 mb-2">Email</label>
                        <input type="email" id="email" name="email" required 
                               class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-primary">
                    </div>
                    <div>
                        <label for="password" class="block text-sm font-medium text-gray-300 mb-2">Password</label>
                        <input type="password" id="password" name="password" required 
                               class="w-full px-4 py-3 bg-gray-700 border border-gray-600 rounded-lg focus:outline-none focus:border-primary">
                    </div>
                    <button type="submit" 
                            class="w-full bg-primary hover:bg-primary/80 text-white py-3 rounded-lg font-medium transition-colors">
                        Sign In
                    </button>
                </form>
                
                <div class="mt-6 text-center">
                    <p class="text-gray-400 mb-4">Don't have an account?</p>
                    <button id="signupBtn" 
                            class="border border-primary text-primary hover:bg-primary hover:text-white px-6 py-2 rounded-lg font-medium transition-colors">
                        Create Account
                    </button>
                </div>
            </div>
            
            <!-- Status Information -->
            <div class="bg-gray-800 rounded-lg p-6">
                <h3 class="text-lg font-semibold mb-4">Server Status</h3>
                <div class="flex items-center justify-between">
                    <span class="text-gray-400">API Health</span>
                    <div class="flex items-center gap-2">
                        <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-green-400 font-medium">Operational</span>
                    </div>
                </div>
            </div>
            
            <!-- Navigation -->
            <div class="flex flex-wrap justify-center gap-4 mt-8">
                <a href="https://www.sfti-ai.org" class="border border-primary text-primary hover:bg-primary hover:text-white px-6 py-3 rounded-lg font-medium transition-colors">
                    Main Site
                </a>
                <a href="https://dev.sfti-ai.org" class="border border-secondary text-secondary hover:bg-secondary hover:text-white px-6 py-3 rounded-lg font-medium transition-colors">
                    PWA Hub
                </a>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script type="module">
        import { apiClient } from '../shared/lib/apiClient.js';
        
        // Initialize authentication form
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const credentials = {
                email: formData.get('email'),
                password: formData.get('password')
            };
            
            try {
                const response = await apiClient.login(credentials);
                alert('Login successful!');
                console.log('User logged in:', response.user);
            } catch (error) {
                alert('Login failed: ' + error.message);
            }
        });
        
        // Signup button
        document.getElementById('signupBtn').addEventListener('click', () => {
            // In production, show signup form or redirect
            alert('Signup functionality will be available soon.');
        });
        
        // Check API health
        apiClient.healthCheck()
            .then(response => {
                console.log('API Health:', response);
            })
            .catch(error => {
                console.error('API Health check failed:', error);
                // Update status indicator to show offline
                const statusEl = document.querySelector('.bg-green-500');
                if (statusEl) {
                    statusEl.className = 'w-3 h-3 bg-red-500 rounded-full';
                }
                const statusText = document.querySelector('.text-green-400');
                if (statusText) {
                    statusText.textContent = 'Offline';
                    statusText.className = 'text-red-400 font-medium';
                }
            });
    </script>

    <!-- Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('/sw.js')
                    .then(function(registration) {
                        console.log('SW registered: ', registration);
                    })
                    .catch(function(registrationError) {
                        console.log('SW registration failed: ', registrationError);
                    });
            });
        }
    </script>
</body>
</html>
